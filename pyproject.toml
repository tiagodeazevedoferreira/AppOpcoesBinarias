[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app-opcoes-binarias"
version = "0.2.0"
description = "Autonomous AI trading research and paper-trading system."
requires-python = ">=3.11"
dependencies = [
  "websocket-client>=1.8,<2",
  "pydantic-settings>=2.6,<3",
  "firebase-admin>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
