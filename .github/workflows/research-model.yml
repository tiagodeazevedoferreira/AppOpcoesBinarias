name: Research Model

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && pip install .

      - name: Evaluate research model
        run: >-
          python -m app_opcoes_binarias.scripts.evaluate_models
          --symbol frxEURUSD
          --horizon 60
          --train-ratio 0.7

      - name: Upload model report
        uses: actions/upload-artifact@v4
        with:
          name: research-model-report
          path: artifacts/model_report.json
          if-no-files-found: error
