name: Market data smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Collect 100 historical EUR/USD ticks
        run: python -m app_opcoes_binarias.scripts.collect_market_data --count 100

      - name: Validate collected sample
        run: |
          test -s data/raw/eurusd_ticks.jsonl
          python - <<'PY'
          import json
          from pathlib import Path

          rows = [json.loads(line) for line in Path("data/raw/eurusd_ticks.jsonl").read_text().splitlines()]
          assert len(rows) == 100
          assert all(row["symbol"] == "frxEURUSD" for row in rows)
          assert all(row["quote"] for row in rows)
          epochs = [row["epoch"] for row in rows]
          assert epochs == sorted(epochs)
          print(f"Validated {len(rows)} ticks; range={epochs[0]}..{epochs[-1]}")
          PY

      - name: Upload sample artifact
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-tick-sample
          path: data/raw/eurusd_ticks.jsonl
          retention-days: 3
