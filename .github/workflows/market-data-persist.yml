name: Market Data Persistence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  collect-and-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && pip install .

      - name: Collect EUR/USD history
        run: python -m app_opcoes_binarias.scripts.collect_and_store --symbol frxEURUSD --count 1000
