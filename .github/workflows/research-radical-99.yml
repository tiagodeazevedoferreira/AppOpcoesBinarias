name: Research Radical 99 Edge

on:
  workflow_dispatch: {}
  push:
    branches: [main, research/radical-99]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e .[dev]
      - name: Unit tests
        run: python -m pytest -q

  radical-evaluation:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Evaluate selective 99% objective
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python -m app_opcoes_binarias.scripts.evaluate_radical_edge \
            --symbol frxEURUSD \
            --horizon 60 \
            --train-ratio 0.7 \
            --folds 5 \
            --target-accuracy 0.99 \
            --min-evidence 100 \
            --output artifacts/radical_edge_report.json
