name: Research Signal Data Expansion

on:
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * 1"

permissions:
  contents: read

jobs:
  expand-and-diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Expand 24 hours of EUR/USD history backwards
        run: >-
          python -m app_opcoes_binarias.scripts.expand_historical_data
          --symbol frxEURUSD
          --hours 24
          --batch-size 1000
          --max-batches 100

      - name: Evaluate signal walk-forward compact
        run: >-
          python -m app_opcoes_binarias.scripts.evaluate_signal_walk_forward_compact
          --symbol frxEURUSD
          --horizon 60
          --folds 5
          --lookbacks 1,2,5,10,30,60
