name: Research Signal Stability

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Evaluate signal walk-forward, 10 folds
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python -m app_opcoes_binarias.scripts.evaluate_signal_walk_forward_compact \
            --symbol frxEURUSD --horizon 60 --folds 10 --lookbacks 60
      - name: Evaluate signal walk-forward, 20 folds
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python -m app_opcoes_binarias.scripts.evaluate_signal_walk_forward_compact \
            --symbol frxEURUSD --horizon 60 --folds 20 --lookbacks 60
