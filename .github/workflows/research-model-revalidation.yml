name: Research Model Revalidation

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Run ruff
        run: python -m ruff check .
      - name: Evaluate corrected research baselines and models
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python -m app_opcoes_binarias.scripts.evaluate_models \
            --symbol frxEURUSD \
            --horizon 60 \
            --train-ratio 0.7 \
            --walk-forward-folds 5 \
            --output artifacts/model_report.json
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-research-report
          path: artifacts/model_report.json
          if-no-files-found: ignore
