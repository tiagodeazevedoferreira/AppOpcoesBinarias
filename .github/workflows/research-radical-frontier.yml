name: Research Radical Precision Frontier

on:
  workflow_dispatch: {}
  push:
    branches: [main, research/radical-v2-multiscale]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check .

  precision-frontier:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Evaluate precision frontier
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python -m app_opcoes_binarias.scripts.evaluate_radical_frontier \
            --symbol frxEURUSD \
            --horizon 60 \
            --train-ratio 0.7 \
            --folds 5 \
            --output artifacts/radical_frontier_report.json
